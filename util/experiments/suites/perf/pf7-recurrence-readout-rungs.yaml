# PF-7 (plan §12.3): readout-rung cost — fit time + r2 per rung (the DP-3 cost/benefit).
# Thresholds unratified (§12).
schema_version: 1
suite:
  name: pf7-recurrence-readout-rungs
  description: "PF-7: linear/rff/mlp readout cost on irregular_sine"
  app: recurrence
  base_config: [../../../../../juniper-recurrence/conf/experiments/irregular-sine-rff.yaml]
  seed_policy: fixed
# per_run_timeout_seconds 1800 -> 4500 (juniper-ml#2210): above the cells' worst-case driver budget of 3900 s,
# the health waits (180) + dataset (120) + train, predict, crossval and save_model at the base's 900 s wall each.
execution: {mode: sequential, continue_on_failure: true, per_run_timeout_seconds: 4500}
matrix:
  train.readout: [linear, rff, mlp]
outputs: {suite_dir: null, aggregate: [csv, markdown]}
