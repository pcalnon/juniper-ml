# PF-3 (plan §12.3): candidate-pool x process-count scaling — speedup curve + oversubscription
# onset (read against the H-11 thread budget via the dashboard's Process CPU Rate panel).
# runtime.num_processes rides the driver's rule-6-clean runtime: block. Thresholds unratified.
#
# ~~BLOCKED 2026-09-10 -- DO NOT LAUNCH AS WRITTEN.~~ The runtime: block was validated by the
# driver and accepted by the cascor service but READ BY NOTHING on either path (no launcher
# export, no settings projection), so the runtime.num_processes axis below was a no-op and this
# 4x3 matrix would have been four pool sizes run three times each.
# notes/JUNIPER_2026-09-10_JUNIPER-ECOSYSTEM_PERF-LANE-PF8-OCCUPANCY-PROBE.md §4, P2 plan item 2.2.
#
# THE INERT-AXIS BLOCKER IS DISCHARGED, 2026-09-22. The owner ruled D2 "implement, via the
# environment route" (notes/JUNIPER_2026-09-11_JUNIPER-ECOSYSTEM_PERF-LANE-SIX-OWNER-DECISIONS-RULED.md),
# and that is now built: run_suite.runtime_block_env maps this block onto the process
# environment and experiment_stack.bash exports CASCOR_NUM_PROCESSES per cell at cascor
# bring-up. The num_processes legs below therefore differ in the runtime for the first time.
#
# RE-SHAPED 2026-09-23 -- 4x3 = 12 cells became a TRIANGLE of 14. The three reasons:
#   * np > pool is a DUPLICATE, not a data point. cascor clamps workers to
#     `max(1, min(process_count, len(tasks)))` (`cascade_correlation.py:2685` at cascor 0d2d826)
#     and len(tasks) IS the pool size, so every (pool, np > pool) cell re-runs (pool, np = pool).
#     The old matrix had exactly ONE such pair (pool 2: np 2 and np 4) -- one redundant cell,
#     not two. The `exclude` rows below drop all six np > pool cells of the wider axis.
#   * np=1 is KEPT, as the SEQUENTIAL CONTROL -- not as a point on the pool curve. It takes
#     `_execute_sequential_training` (`:2473`, only when no remote workers are registered), a
#     different code path from a one-worker pool. Read it as its own series (the time an operator
#     gets with parallelism off); compute the speedup CURVE over np in {2, 4, 8, 16} only.
#   * np EXTENDED to 8 and 16. This suite's second purpose is OVERSUBSCRIPTION ONSET, and with
#     `worker_thread_count: 1` plus the parent's `blas_threads: 2` (from spiral-smoke) the thread
#     demand is np + 2 on 16 logical / 8 physical CPUs. np <= 4 could never have shown the onset,
#     so the old axis answered half the question. np=16 is legal: cascor takes
#     CASCOR_NUM_PROCESSES as `max(1, int(value))` with no upper bound.
#   Cost is NOT re-measured: the ~6.7 h estimate was for the old 12 cells. The shape drops one
#   cheap cell and adds three highly parallel ones, so expect roughly 7 h per pass.
#
# D3's ONE-CELL CHECK PASSED 2026-09-23, on c001-e9909d5d (pool 2, np 2; cascor 0d2d826). The
# run's manifest.json records thread_env CASCOR_NUM_PROCESSES "2" (BLAS vars "2"), AND the
# service log records `Training 2 candidates with 2 processes` for both candidate phases, so the
# check proved DELIVERY, not just recording. Re-run it on any cell after changing the launcher or
# the runtime-block mapping: `--only <cell_id>`, then read that run's manifest.json and its
# logs/juniper-cascor.log. NOT `--dry-run`, which returns before cells are materialised.
#   ⚠ The check EXITS 1 even when the cell succeeds, and that is documented design, not a fault:
#   run_suite's exit 0 means every cell in the FULL expansion has succeeded, so the 13 unselected
#   cells count as not-run (docs/REFERENCE.md § "Resume, --only, and exit codes"; under --resume,
#   0 means "the suite is complete"). The exit status is not the check's verdict. The manifest
#   and the service log are.
#
# STILL DO NOT LAUNCH THE MATRIX. The duplicate/sequential reason is closed by the re-shape above,
# and D3's check has passed; one reason remains:
#   EVERY NUMBER HERE IS WALL-CLOCK, and the host has not been quiet in six sessions (load
#      4.7-32 across 2026-09-11..23). The loaded-host design (rulings §3: interleave or randomise
#      arm order, with repeats) is only HALF expressible in run_suite: it has no shuffle, but it
#      runs the matrix product in key order with the LAST key fastest, so a LEADING repeat key
#      (e.g. `experiment.description: [pass 1, pass 2, pass 3]`, stripped from the workload
#      fingerprint) runs every cell once per pass -- round-robin. pf2-axis2-cascor-dataset-range.yaml
#      does exactly that. For this suite that means 42 cells, about 21 h. Otherwise, wait for a
#      1-minute load under 3.
# Thresholds remain unratified -- do not read a result against a threshold nobody approved.
#
# OWNER RULED 2026-09-24 (notes/JUNIPER_2026-09-11_JUNIPER-ECOSYSTEM_PERF-LANE-SIX-OWNER-DECISIONS-RULED.md
# §6): WAIT FOR A QUIET WINDOW -- no clamscan running, and a 1-minute load that STAYS under ~6.
# Declined: running round-robin on the loaded host now, or waiting for the owner to free the host.
# A window opened at 02:39 local that night (4.20 / 4.09 / 3.48) and closed within minutes, when a
# peer session's test run took the load to 8.97. So check the load at launch, and record it
# throughout with util/ad-hoc/2026-09-08_loadavg_sampler.py beside the suite dir. One pass is ~7 h.
schema_version: 1
suite:
  name: pf3-cascor-pool-scaling
  description: "PF-3: candidate_pool_size x num_processes"
  app: cascor
  base_config: [../../../../../juniper-cascor/conf/experiments/spiral-smoke.yaml]
  seed_policy: fixed
# stall_seconds (ml#1069): the smoke base caps max_epochs but NOT candidate_epochs, so the
# CANDIDATE phase is full-length here too — and the Q-2 detector reports no current_epoch
# progress while it runs. The pool-16 cells would be recorded `stalled` at the 120 s driver
# default while healthy, which would corrupt the speedup curve this suite exists to measure;
# the num_processes: 1 leg serialises that pool and is the slowest cell in the sweep.
#
# max_wall_seconds: the stall window above was INERT until this line existed. `spiral-smoke`
# pins outputs.max_wall_seconds: 600, and before run_suite forwarded --max-wall-seconds there
# was no way for a suite to raise it — so the wall budget ended every cell at 600 s and a
# 1200 s stall window could never be reached. A healthy long candidate phase was recorded
# `timed_out` instead of `stalled`: a different wrong label, not a working guard. 2000 s sits
# above the stall window and below per_run_timeout_seconds, keeping the DRIVER the component
# that stops a run (it writes an honest manifest; a subprocess kill leaves none).
execution: {mode: sequential, continue_on_failure: true, per_run_timeout_seconds: 2400, stall_seconds: 1200, max_wall_seconds: 2000}
matrix:
  training.params.candidate_pool_size: [2, 4, 8, 16]
  runtime.num_processes: [1, 2, 4, 8, 16]
# np > pool duplicates np = pool (the :2685 clamp) -- see the RE-SHAPED block above.
exclude:
  - {training.params.candidate_pool_size: 2, runtime.num_processes: 4}
  - {training.params.candidate_pool_size: 2, runtime.num_processes: 8}
  - {training.params.candidate_pool_size: 2, runtime.num_processes: 16}
  - {training.params.candidate_pool_size: 4, runtime.num_processes: 8}
  - {training.params.candidate_pool_size: 4, runtime.num_processes: 16}
  - {training.params.candidate_pool_size: 8, runtime.num_processes: 16}
outputs: {suite_dir: null, aggregate: [csv, markdown]}
