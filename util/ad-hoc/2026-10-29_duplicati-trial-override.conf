# Phase D step 0(b) (2026-10-29): the drop-in for the confinement trial of duplicati.service.
#
# Project:     juniper-ml
# Sub-Project: ad-hoc tooling
# Author:      Paul Calnon
# Created:     2026-10-29
# Status:      ad-hoc -- recovery (Phase D step 0(b); D's O-12)
# Retire when: RETAINED -- ad-hoc files are kept as provenance of record (owner policy 2026-08-25)
# Related:     notes/JUNIPER_2026-10-03_JUNIPER-ECOSYSTEM_BACKUP-SYSTEM-STATE-ASSESSMENT-AND-RECOVERY-PLAN.md
#              section 6.4 step 0; notes/JUNIPER_2026-09-21_JUNIPER-ECOSYSTEM_BACKUP-INFRASTRUCTURE-INTEGRATED-
#              DESIGN.md section 7.3.2 (O-12) and the AC-12 row.
#
# Installed, by the owner as root, at /run/systemd/system/duplicati-trial.service.d/override.conf, beside
# /run/systemd/system/duplicati-trial.service, which is util/systemd/duplicati.service copied byte for byte.
# So the trial runs the unit step 9 will install, parsed by the same unit-file parser, with every confinement
# directive it sets. What this file changes: it resets and re-sets four directives (ExecStart=,
# EnvironmentFile=, LoadCredential=, SystemCallErrorNumber=); the copied defaults file it names carries the
# port and the data folder, which makes six; and it adds a seventh to tenth, none a confinement directive:
# Restart=no, the wrapper's env file, console logging (with a planted unknown option as its positive control),
# and a Description=. Each is needed because the real start's inputs do not exist yet, or are the live Tier 1
# server's, or (the logging) because without it the trial's journal cannot show the server's own warnings.
# Without them, a missing file or a bind failure would read as a directive the server cannot run under, which
# AC-12 would then remove. The unit file and this drop-in live under /run/systemd/system (a tmpfs, so a reboot
# removes them); the trial's three inputs live under /usr/local/lib/duplicati-trial (below). The owner removes all
# of them after the trial.
#
# An empty assignment RESETS each list: ExecStart= (systemd.service(5)); EnvironmentFile= and
# SystemCallErrorNumber= (systemd.exec(5)); LoadCredential= (not in the man page, but load-fragment.c at v259
# resets on an empty value; without the reset, v259 would REPLACE the path for the same ID,
# exec-credential.c). The session reads the effective LoadCredential with busctl after the daemon-reload and
# before any start.

[Unit]
# Cosmetic: so `systemctl status` and the journal cannot be mistaken for the real unit's.
Description=Phase D step 0(b) trial of duplicati.service's property set (throwaway folder and key)

[Service]
# The three files the trial executes or reads as configuration live in /usr/local/lib/duplicati-trial/,
# root-owned 0755, beside the /usr/local/lib/duplicati/ the installer creates at step 9:
#   * not in the duplicati-owned scratch folder: a file the duplicati uid can replace is a code-injection path
#     into a process holding CAP_DAC_READ_SEARCH (util/systemd/duplicati-env.contract's crossing; round 2, R2B-7);
#   * not under /run: this host mounts /run noexec, so a wrapper there fails every start with 203/EXEC before any
#     directive is tried (round 3, R3-1). / is ext4 without noexec, and ProtectSystem=strict only makes it
#     read-only.
# Only the data folder, which the server must own, stays under /home/duplicati.
#
# 1. ExecStart: /usr/local/lib/duplicati/ does not exist until step 9's installer. The repository's
#    scripts/duplicati-wrapper.bash, copied 0755 root:root, with the unit's own `$DAEMON_OPTS` word -- and one
#    planted unknown option, the positive control for item 9: with console logging working, the journal shows
#    exactly one "Unknown option supplied" line, naming it; any second one is a production option word the
#    server does not know (AC-14), and none at all means the logging did not reach the journal.
ExecStart=
ExecStart=/usr/local/lib/duplicati-trial/duplicati-wrapper.bash $DAEMON_OPTS --phase-d-trial-unknown-option-marker
# 2. EnvironmentFile: the unit's would load the OLD /etc/default/duplicati. Instead, the repository's
#    util/systemd/duplicati.default with exactly two words changed -- 3. the port (8300 is the live server's,
#    pid 1397393) and 5. the data folder (step 0(a)'s) -- so the file's own quoting is still what is parsed.
EnvironmentFile=
EnvironmentFile=/usr/local/lib/duplicati-trial/duplicati.default
# 4. The credential: step 0(a)'s throwaway key, not the real one (step 9 writes that). It sits under
#    /etc/credstore, which the unit masks with InaccessiblePaths=, so the trial also tests D section
#    7.3.2's claim that the mask does not break LoadCredential= (the manager reads the file first).
LoadCredential=
LoadCredential=settings-key:/etc/credstore/phase-d-trial-key
# 6. Unset (empty = kill): a blocked system call kills the server with SIGSYS, a visible crash, where the
#    unit's EPERM would let the runtime fall back silently (D section 7.3.2). The real unit keeps EPERM; the
#    switch is recorded once the trial shows what the server needs.
SystemCallErrorNumber=
# 7. A failed trial must not restart itself.
Restart=no
# 8. The wrapper's env file: the repository contract, copied 0640 root:duplicati as step 9 would install it at
#    /etc/duplicati/env (absent until then).
Environment=DUPLICATI_ENV_FILE=/usr/local/lib/duplicati-trial/env
# 9. Console logging at Warning. 2.4.0.0 writes its own log messages -- "Unknown option supplied" (AC-14's
#    string), every Log.Write* warning and error -- to a console destination ONLY under --log-console
#    (Program.cs ConfigureLogging; CommandLineArgumentValidator.cs logs, never prints), so without this the
#    trial's journal could not show them. Read as DUPLICATI__<OPTION> environment options (Program.cs
#    ApplyEnvironmentVariables, applied before ConfigureLogging), so DAEMON_OPTS stays production's, word for
#    word. Item 1's planted option proves it reaches the journal.
Environment=DUPLICATI__LOG_CONSOLE=true
Environment=DUPLICATI__LOG_LEVEL=Warning
