# Standing rules the Template Agent injects into generated prompts (design 5.7).
# Owner-curated; the resolver (util/template_data_resolver.py) maps these into slots.
version: 1

owner_approves:
  - "PR merges (Paul merges; admin bypass; mergeStateStatus BLOCKED with green checks is the normal state)"
  - "PyPI publish + deploy environment gates (never auto-approve, even when gh is authed as the owner)"

worktree_root: "/home/pcalnon/Development/python/Juniper/worktrees"

dup_guard: "Run `gh pr list` before assuming a red PR is yours; it flags duplicate WORK, not file-name collisions."

rules:
  one_pr_per_work_unit: true
  no_merge_without_pr: true
  worktree_cleanup_only_on_merge: true
  do_not_force_push_pr_branches: true
  scripts_live_under_util: "Utility/single-use/temporary scripts go in util/ (ad-hoc -> util/ad-hoc/). No file is ever written under /tmp (owner rule, 2026-10-26): temp files go to the repo's gitignored tmp/ (TMPDIR is the primary checkout's); never a /tmp literal or a ${TMPDIR:-/tmp} fallback."
  repo_tmp_rulings: >-
    Owner rulings on the repo tmp/, 2026-10-26 (canonical: notes/JUNIPER_2026-10-26_JUNIPER-ECOSYSTEM_REPO-TMP-DIRECTORY-CONVENTION.md):
    juniper-check-doc-links ignores tmp/ (every invocation passes --exclude tmp); pytest does not ignore tmp/
    (no norecursedirs, --ignore or collect_ignore entry names it); a local Docker build ignores tmp/ (the build
    context's .dockerignore lists it); tmp/ is a valid search location (a script that counts matches with grep or
    find includes it); full-tree copies of the repo, and copies of log files, may live in tmp/. Retention: a file a
    work arc writes to tmp/ is kept until it is no longer needed, no work arc (its own included) uses it, and it is
    no longer needed for documentation or reference, and, where needed, until it has been archived in an
    appropriate non-temporary directory. Only then may it be deleted.
