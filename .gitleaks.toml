# =============================================================================
# Gitleaks Configuration — Juniper Ecosystem
#
# Detects accidentally committed secrets. SOPS-encrypted files are allowlisted
# since they contain encrypted (not plaintext) secrets.
#
# Added 2026-08-13 alongside the Gitleaks step in ci.yml's `Security Scan` job
# (Tier 2 CI hardening). juniper-ml was the only repo of the nine with no secret
# scanning at all; this allowlist is required for that step to be usable, because
# the repo tracks a SOPS-encrypted `.env.enc` and a `.sops.yaml` carrying age
# PUBLIC keys — both of which gitleaks flags without it.
#
# Kept byte-identical in intent to juniper-deploy / juniper-cascor so the fleet
# shares one allowlist contract.
#
# 2026-10-10 (backup recovery B9, design P0.5a item 6): until this date the file
# had no `[extend]` table, and a gitleaks v8 config without one loads ONLY its
# own `[[rules]]` -- of which there were none. Every CI scan from 2026-08-13 ran
# with ZERO rules and passed vacuously, which is how a 36-character credential
# literal in scripts/duplicati-wrapper.bash went through two PRs (#1967, #1968).
# `[extend] useDefault = true` below loads gitleaks' built-in ruleset; the
# `juniper-secret-assignment` rule adds the shape that ruleset cannot see
# (its generic-api-key value class `[\w.=-]` stops at `* @ $ %`).
# tests/test_gitleaks_secret_assignment_rule.py pins both.
#
# Usage (the CI step and the pre-commit hook both auto-discover this file):
#   gitleaks git --redact          # committed history; honours .gitleaksignore
#   gitleaks dir --redact .        # the working tree, INCLUDING gitignored files:
#                                  # a __pycache__/*.pyc can read as a finding
#   python3 util/ad-hoc/2026-10-10_gitleaks_probe.py vacuity --gitleaks <bin>
#
# See: https://github.com/gitleaks/gitleaks#configuration
# =============================================================================

title = "Juniper Gitleaks Configuration"

# Load gitleaks' built-in rules; the rules and allowlists below EXTEND them.
# Removing this table silently empties the ruleset again (see the header).
[extend]
useDefault = true

# Do NOT use [allowlist].paths to exempt .env.enc files — this would
# skip ALL rules for those files, including plaintext secret detection.
# See: https://github.com/gitleaks/gitleaks/issues/1790
#
# That distinction is the whole point here: the companion `SOPS Validation` job
# proves every value line in a tracked *.enc file is real ciphertext, so a
# partially-decrypted .env.enc is caught rather than silently allowlisted.

[allowlist]
  description = "Allowlisted patterns"

  # age public keys are not secrets (only the private key is sensitive)
  # SOPS-encrypted ciphertext values (ENC[AES256_GCM,...]) are safe to commit
  regexes = [
    '''age1[a-z0-9]{58}''',
    '''ENC\[AES256_GCM,data:[A-Za-z0-9+/=]+,''',
  ]

# -----------------------------------------------------------------------------
# juniper-secret-assignment -- a backup credential assigned a literal value.
#
# NAME=VALUE for the backup stack's credentials, in every form the repository
# uses: `export`, a systemd `Environment=` line (quoted or not), a comment (a
# commented-out secret is still a secret), and argv (`--passphrase=`,
# `--webservice-password=`, `--settings-encryption-key=`). Names, matched
# case-sensitively after a word boundary (so TEST_PASSPHRASE is not one):
#   SETTINGS_ENCRYPTION_KEY[_OLD]   PASSPHRASE[_OLD]   DUPLICATI_WEB_CREDENTIAL
#   DUPLICATI__PASSPHRASE / __SETTINGS_ENCRYPTION_KEY / __WEBSERVICE_PASSWORD
#     (Duplicati's environment form of its options; run-scripts receive them)
#   settings-encryption-key   webservice-password[-init]   passphrase
#
# The VALUE is at least 12 characters and has no CR, LF, backtick or
# backslash. A value OPENED by `"` or `'` right after the `=` runs to the
# matching close quote and may contain spaces and tabs, so a diceware phrase in
# quotes (four words, three spaces) is ONE value (added 2026-10-25); with no
# close quote on the line it is read as unquoted. An unquoted value stops at
# the first whitespace or quote. Either way it must not START with whitespace,
# `$ % < { ( [ | \` or any other character outside the class below: a value
# beginning that way is an expansion (`$VAR`, `${VAR:-}`, `$(cmd)`), a printf
# or systemd specifier (`%s`, `%d`), a `<template>`, a `{format}` field or
# code, never a literal.
#
# The four allowlists hold what the value class cannot exclude: placeholders,
# single-case words, code and quoted prose. Measured against every commit
# reachable from every branch and tag on the remote (what a workflow_dispatch
# run scans; ~3,130 commits on 2026-10-25), the rule reports 10 historical
# lines: the two commits that carried the 2026-09-20 literal, and eight test
# fixtures and synthetic keys, all in .gitleaksignore (commit-scoped). An
# ablation that drops one allowlist adds: placeholder words 4 (`fixture-` /
# `placeholder-` test values), one lowercase word 16 (the `abcdefghijklmnop`
# fixture), code 7, quoted prose 0 -- no historical line needs that one alone;
# the tests' prose samples are what hold it in place.
#
# Narrowed in review (ml#2203): a run of lowercase words joined by `-` or `_`
# (a diceware passphrase) and a 12-15 character word-only value (a typical
# human password) FIRE. generic-api-key covers neither under the PASSPHRASE
# names, so this rule is the only thing that sees them there.
#
# Known boundary -- what still does NOT fire, deliberately:
#   * a value under 12 characters (quoted: counted to its close quote);
#   * whitespace in any value not quoted right after the `=` -- an unquoted
#     value, a quote with no close quote on its line, and the systemd form
#     that quotes the whole assignment (`Environment="PASSPHRASE=two words"`)
#     all stop at the first space;
#   * a quoted value holding one of the English function words the last
#     allowlist lists (the, you, set, ...), as a whole word: prose, but also a
#     passphrase that happens to contain one;
#   * ONE lowercase word (letters only: no digit, capital or separator);
#   * UPPER words with an optional short number (they read as constant names);
#   * lowercase words joined by `.` (indistinguishable from `args.passphrase`),
#     and a lowercase or UPPER_SNAKE name closed by `) ] ,`;
#   * a value starting with whitespace, `$ % < { ( [ | \` or a non-ASCII
#     character, or containing a placeholder word (redacted, changeme,
#     placeholder, example, dummy, synthetic, fixture, fake, sample).
# -----------------------------------------------------------------------------
[[rules]]
id = "juniper-secret-assignment"
description = "Backup credential (Duplicati settings key, passphrase, web credential) assigned a literal value"
regex = '''\b(?:SETTINGS_ENCRYPTION_KEY(?:_OLD)?|settings-encryption-key|PASSPHRASE(?:_OLD)?|DUPLICATI_WEB_CREDENTIAL|webservice-password(?:-init)?|passphrase|DUPLICATI__(?:PASSPHRASE|SETTINGS_ENCRYPTION_KEY|WEBSERVICE_PASSWORD))=(?:"([A-Za-z0-9!#&*+,\-./:;=?@^_~][^"\r\n`\\]{11,})"|'([A-Za-z0-9!#&*+,\-./:;=?@^_~][^'\r\n`\\]{11,})'|["']?([A-Za-z0-9!#&*+,\-./:;=?@^_~][^ \t\r\n"'`\\]{11,}))'''
# No `secretGroup`: the regex has three groups (double-quoted, single-quoted,
# unquoted), only one of which can match, and with secretGroup unset gitleaks
# takes the first non-empty group as the value (detect/detect.go, 8.24.3).
# gitleaks evaluates a rule only on content containing one of its keywords
# (lowercased); every name above must contain one of these.
keywords = [
  "settings_encryption_key",
  "settings-encryption-key",
  "passphrase",
  "duplicati_web_credential",
  "webservice-password",
  "webservice_password",
]

  [[rules.allowlists]]
  description = "Placeholder words, and a value with no letter or digit other than x/X (xxx, ***, ...)"
  regexes = [
    '''(?i)redacted|change[-_]?me|placeholder|example|dummy|synthetic|fixture|fake|sample''',
    '''^[^0-9A-WYZa-wyz]*$''',
  ]

  [[rules.allowlists]]
  description = "Single-case words: ONE lowercase word, or UPPER words with an optional short number (abcdefghijklmnop, SYNTHETIC-VALUE-01)"
  regexes = [
    '''^[a-z]+$''',
    '''^[A-Z]{3,}(?:[-_][A-Z]{2,})*(?:[-_]?[0-9]{1,3})?$''',
  ]

  # A BARE name is deliberately not allowlisted: a lowercase hex or alphanumeric
  # key is a valid identifier too. The second form needs trailing code syntax
  # and a name of lowercase letters/underscores or UPPER_SNAKE (with a `_`).
  [[rules.allowlists]]
  description = "Code: attribute access or a call (args.passphrase, self._read()), or a name closed by ) ] , (passphrase), PROBE_PASSPHRASE,)"
  regexes = [
    '''^[a-z_][a-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)+[(\[]?[)\],]*$''',
    '''^(?:[a-z_]+|_*[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+)[(\[)\],]+$''',
  ]

  # Only a QUOTED value can hold whitespace, so only a quoted value can meet
  # this: one of the listed English function words as a whole word, bounded by
  # a space, a tab or an end of the value. It separates instructions in quotes
  # from a diceware passphrase: `passphrase="the one you set"` is prose, while
  # `"correct horse battery staple"` contains none of these words and fires. A
  # passphrase that does contain one of them is missed (see the boundary in the
  # comment above).
  [[rules.allowlists]]
  description = "Quoted prose: a multi-word value containing a common English function word (the, you, your, one, set, ...)"
  regexes = [
    '''(?i)(?:^|[ \t])(?:a|an|the|and|or|but|not|no|nor|to|of|in|on|at|by|for|with|from|into|as|is|are|was|were|be|been|it|its|this|that|these|those|there|here|you|your|yours|we|our|us|they|their|them|he|she|his|her|i|me|my|one|any|some|all|what|which|who|how|when|where|if|then|than|so|do|does|did|can|will|set|use|see)(?:[ \t]|$)''',
  ]
