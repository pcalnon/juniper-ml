---
#####################################################################################################################################################################################################
# Project:       Juniper
# Application:   juniper-config-tools (subdirectory of juniper-ml)
# File Name:     ci-config-tools.yml
# Author:        Paul Calnon
#
# Date Created:  2026-05-22
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    CI pipeline for the juniper-config-tools package (Wave 0 of the
#    env-var alias-with-deprecation helper PyPI migration -- see
#    notes/JUNIPER_2026-05-22_JUNIPER-ML_CONFIG-TOOLS-PYPI-MIGRATION-PLAN.md). Runs
#    on PRs and pushes that touch the package or its tests. The
#    juniper-ml meta-package's own ci.yml continues to gate the meta-
#    package; this workflow handles the config-tools subpackage
#    lifecycle independently, mirroring the precedent set by
#    ci-doc-tools.yml and ci-ci-tools.yml.
#
#####################################################################################################################################################################################################

name: CI — juniper-config-tools

on:
  push:
    branches: [main]
    paths:
      - "juniper-config-tools/**"
      - ".github/workflows/ci-config-tools.yml"
  pull_request:
    branches: [main]
    paths:
      - "juniper-config-tools/**"
      - ".github/workflows/ci-config-tools.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Python 3.15 is INFORMATIONAL (phase 1 of the 3.15 migration, 2026-11-14): its leg reports, but a
    # failure there fails neither this job nor the run. Same pattern as ci.yml's `tests` job.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.15"
            experimental: true
    defaults:
      run:
        working-directory: juniper-config-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        id: checkout
        continue-on-error: ${{ matrix.experimental == true }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        id: setup-python
        continue-on-error: ${{ matrix.experimental == true }}
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test extras
        id: install-package-test-extras
        continue-on-error: ${{ matrix.experimental == true }}
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install -e ".[test]"

      - name: Run unit tests with coverage
        id: run-unit-tests-with-coverage
        continue-on-error: ${{ matrix.experimental == true }}
        run: |
          python -m pytest \
            --cov=juniper_config_tools \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-fail-under=85

      - name: Enforce per-file coverage gate (blocking)
        id: enforce-per-file-coverage-gate-blocking
        continue-on-error: ${{ matrix.experimental == true }}
        run: |
          pip install "juniper-ci-tools>=0.9.0,<0.10.0"
          juniper-coverage-gap-map --coverage-json coverage.json --enforce

      - name: Report the informational Python 3.15 result
        # Python 3.15 is INFORMATIONAL (phase 1 of the 3.15 migration). On the 3.15 leg every step above
        # carries `continue-on-error: ${{ matrix.experimental == true }}`, so a failing step neither stops
        # this job nor turns its check red, and no merge, push or deployment waits on it. This step says
        # what failed instead: a warning annotation, and a table in the job summary.
        if: always() && matrix.experimental == true
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          PY_LEG: ${{ matrix.python-version }}
        run: |
          python3 - <<'PY'
          import json, os
          steps = json.loads(os.environ["STEPS_JSON"])
          leg = os.environ["PY_LEG"]
          failed = [k for k, v in steps.items() if v.get("outcome") not in ("success", "skipped")]
          rows = "\n".join(f"| `{k}` | {v.get('outcome')} |" for k, v in steps.items())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(f"### Python {leg}: informational, blocks nothing\n\n| Step | Outcome |\n|---|---|\n{rows}\n")
          if failed:
              print(f"::warning title=Python {leg} (informational)::{len(failed)} step(s) failed on Python {leg}: {', '.join(failed)}. Nothing is blocked; see this job's summary.")
          else:
              print(f"::notice title=Python {leg} (informational)::every step passed on Python {leg}")
          PY

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: juniper-config-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install build twine

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Smoke-test the wheel
        run: |
          set -euo pipefail
          # Install into a clean venv to confirm the module-form entry
          # point works without leaking from the editable install in
          # the test job.
          python -m venv /tmp/cgt-smoke
          /tmp/cgt-smoke/bin/pip install --quiet --upgrade pip
          /tmp/cgt-smoke/bin/pip install --quiet dist/juniper_config_tools-*.whl
          /tmp/cgt-smoke/bin/python -m juniper_config_tools --version
