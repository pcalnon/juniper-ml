          # sha256. A file it does not list yet is CDN lag, polled for a bounded number of times; a file it lists with
          # another sha256, or one this run did not build, fails at once, because neither goes away by waiting.
          import http.client
          import json
          import os
          import pathlib
          import re
          import sys
          import time
          import urllib.request

          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          package = os.environ["PUBLISH_PACKAGE"]
          index = os.environ["INDEX_URL"].rstrip("/")
          attempts = int(os.environ.get("HASH_CHECK_ATTEMPTS", "20"))
          interval = float(os.environ.get("HASH_CHECK_INTERVAL", "15"))


          def normalized(name):
              return re.sub(r"[-_.]+", "-", name).lower()


          expected = {}
          versions = set()
          for line in (workspace / "SHA256SUMS").read_text(encoding="utf-8").splitlines():
              digest, _, name = line.partition("  ")
              if name.endswith(".whl"):
                  project, version = (name[: -len(".whl")].split("-") + [""])[:2]
              elif name.endswith(".tar.gz"):
                  project, _, version = name[: -len(".tar.gz")].rpartition("-")
              else:
                  project, version = "", ""
              if normalized(project) != normalized(package) or not version or not re.fullmatch(r"[0-9a-f]{64}", digest):
                  print(f"::error::SHA256SUMS line {line!r} is not a {package} distribution with its sha256")
                  sys.exit(1)
              expected[name] = digest
              versions.add(version)
          if len(versions) != 1:
              print(f"::error::SHA256SUMS must name one version of {package}; it names {sorted(versions) or 'none'}")
              sys.exit(1)
          url = f"{index}/pypi/{package}/{versions.pop()}/json"
          print(f"{url} must list exactly:")
          for name, digest in sorted(expected.items()):
              print(f"  {digest}  {name}")
          state = "was not read"
          for attempt in range(1, attempts + 1):
              request = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "juniper-publish-hash-check"})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      served = {f["filename"]: f["digests"]["sha256"] for f in json.load(response)["urls"]}
              except (OSError, ValueError, KeyError, TypeError, http.client.HTTPException) as exc:  # HTTPError and URLError are OSErrors
                  state = f"was not readable ({exc})"
              else:
                  wrong = sorted(name for name, digest in served.items() if expected.get(name) != digest)
                  if wrong:
                      print(f"::error::{url} lists a file this run did not build, or with another sha256: {wrong}")
                      for name in sorted(set(expected) | set(served)):
                          print(f"  {name}: built {expected.get(name, '-')}, served {served.get(name, '-')}")
                      sys.exit(1)
                  missing = sorted(set(expected) - set(served))
                  if not missing:
                      print(f"OK: {url} lists exactly these files, with these sha256 (attempt {attempt}/{attempts})")
                      sys.exit(0)
                  state = f"did not list {missing} yet"
              print(f"attempt {attempt}/{attempts}: {url} {state}")
              if attempt < attempts:
                  time.sleep(interval)
          print(f"::error::{url} {state} after {attempts} attempts")
          sys.exit(1)
