---
#####################################################################################################################################################################################################
# Project:       Juniper
# File Name:     lockfile-update.yml (template)
#
# Description:
#    Refresh pinned CI lockfiles weekly via PR. Drop into a target repo's
#    `.github/workflows/lockfile-update.yml`. As of Wave 2 of the dep-docs
#    PyPI migration (notes/JUNIPER_2026-05-20_JUNIPER-ML_CI-TOOLS-PYPI-MIGRATION-PLAN.md),
#    this installs `juniper-ci-tools` from PyPI and invokes the
#    `juniper-generate-dep-docs` console script to regenerate
#    `conf/requirements_ci.txt` and `conf/conda_environment_ci.yaml`.
#    The workflow pushes the diff (if any) onto a new branch and opens a PR.
#
#    PRs are opened by `peter-evans/create-pull-request`.
#
#    A PR opened with the built-in GITHUB_TOKEN gets NO executed checks. On this
#    repo the `pull_request` runs are CREATED but parked at `action_required`
#    with ZERO jobs until a maintainer releases them -- 4 of 4 such PRs,
#    juniper-ml#1304/#1517/#1806/#1932 (re-probed 2026-09-22). No check fails and
#    none reports, so the absence looks like a quiet week rather than a gap. The
#    parked runs are the cheap manual release (#1932's ran as a second attempt
#    started by the owner; #1806 was closed and reopened instead). The previous
#    wording here -- "No additional secret is required for the common case" --
#    is what made that read as fine, and it is why the gap survived.
#
#    So when the repo variable RELEASE_TRAIN_APP_ID is set, this workflow mints a
#    GitHub App installation token and opens the PR as the App identity, which DOES
#    trigger CI. That is the same mechanism release-train.yml already uses for the
#    same reason. When the variable is unset the mint step is skipped and the job
#    degrades to the old GITHUB_TOKEN behaviour, so dropping this file into a repo
#    without the App still works -- it just keeps opening unchecked PRs.
#
#    Requires, per repo: the RELEASE_TRAIN_APP_ID variable and the
#    RELEASE_TRAIN_APP_PRIVATE_KEY secret. The minted token is scoped to the
#    CURRENT REPOSITORY ONLY (both `owner` and `repositories` omitted), not to the
#    App's whole installation.
#####################################################################################################################################################################################################

name: Update Lockfiles

on:
  schedule:
    - cron: '0 8 * * 1'  # weekly Monday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Refresh CI lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install juniper-ci-tools
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-ci-tools>=0.9.0,<0.10.0"

      - name: Regenerate dependency lockfiles
        run: juniper-generate-dep-docs

      # Gated on the repo VARIABLE, not the secret: `secrets` is not allowed in a step-level
      # `if`, and a missing variable is the honest signal that this repo has no App wired up.
      # Omitting both `owner` and `repositories` scopes the token to the current repository
      # only -- least privilege, and portable to whichever repo this template lands in.
      - name: Mint GitHub App token (so the PR triggers CI)
        id: app-token
        if: ${{ vars.RELEASE_TRAIN_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}

      - name: Open PR if lockfiles changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          # App token when one was minted; otherwise the built-in token, whose PRs open
          # without checks. The `||` fallback is what makes the mint step optional: a
          # skipped step yields an empty output, not an error.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          branch: chore/lockfile-update
          delete-branch: true
          # required_signatures (2026-08-12 normalization, juniper-ml#1099):
          # the action's default local commit is UNSIGNED, which makes the PR
          # unmergeable -- an unsigned commit anywhere in the branch history
          # blocks the merge and squash does not rescue it. sign-commits routes
          # the commit through the GitHub API so it is signed as
          # github-actions[bot].
          sign-commits: true
          commit-message: 'chore(deps): refresh CI lockfiles'
          title: 'chore(deps): refresh CI lockfiles'
          body: |
            Automated weekly refresh of CI lockfiles via the
            `juniper-generate-dep-docs` console script from the
            `juniper-ci-tools` PyPI package.
          labels: |
            dependencies
            automated
