---
# turing conda env JuniperCascor1: plan task E2 (decision D8), juniper-cascor's own env spec ported to osx-64.
#
# Source: pcalnon/juniper-cascor conf/conda_environment.yaml at main 4c26919f19068f34f126e4f10e04ed09629ad7cb
# (blob 978117f8), a `conda list --export` of 87 packages from a linux-64 host (conda 25.11.1). The owner's
# checkout (~/Development/python/Juniper/juniper-cascor) was at that same commit, its tracked files identical.
#
# Derivation rules (2026-10-19):
#   - channels: conda-forge only. Every conda package keeps its Linux version; build strings are dropped.
#   - dropped as Linux-only: _openmp_mutex, ld_impl_linux-64, libgcc, libgcc-ng, libstdcxx, libstdcxx-ng, libuuid.
#     The solver adds the macOS counterparts it needs (libcxx; llvm-openmp's own _openmp_mutex).
#   - dropped as CUDA: the 15 nvidia-*-cu12 PyPI wheels and triton.
#   - PyPI torch is replaced by conda-forge pytorch: PyPI has no x86_64 macOS torch wheel after 2.2.
#   - no pip section: every =pypi_0 line was CUDA or torch.
#
# Relaxations. Each pin below has no osx-64 build or cannot co-solve with one; nothing else is unpinned:
#   pytorch    torch 2.9.1 -> 2.10.0   conda-forge osx-64 has no py314 pytorch 2.9.x; 2.10.0 is the first. It is
#                                      also the floor juniper-cascor's pyproject sets (torch>=2.10.0, SEC-F17).
#   libtorch   2.9.1 -> 2.10.0         must equal pytorch.
#   mkl        2025.3.0 -> 2023.2.0    Intel's last macOS MKL; conda-forge osx-64 stops at 2023.2.0.
#   tbb        2022.3.0 -> 2021.13.0   mkl 2023.2.0 requires tbb 2021.*.
#   libblas, libcblas, liblapack 3.11.0 -> 3.9.0
#                                      the Linux env is MKL BLAS (builds *_mkl), and on osx-64 the MKL variant
#                                      ends at 3.9.0 (20_osx64_mkl). Keeping it keeps the cpu_mkl torch the Linux
#                                      env ran, the same stack JuniperPython runs on turing.
#
# Solve (mamba --dry-run against conda-forge osx-64 + noarch repodata of 2026-10-19): 67 packages, ~265 MB;
# python 3.14.2, pytorch 2.10.0 cpu_mkl_py314_hf7736a0_101, mkl 2023.2.0, libblas 3.9.0 20_osx64_mkl, numpy 2.4.1.
#
# Recreate:
#   MAMBA_SSL_VERIFY=true mamba env create --override-channels -c conda-forge -f conf/hosts/turing/conda-envs/JuniperCascor1.yml
#   (mamba 2.x reads MAMBA_SSL_VERIFY; CONDA_SSL_VERIFY reaches only conda itself: plan §18.3 E-SSL.)
#
# Validate: juniper-cascor ci.yml's unit-tests and integration-tests lanes, run from a scratch copy of the repo
# through a `python -m venv --system-site-packages` overlay on this env, so CI's `pip install -e ".[all]"` lands in
# the overlay and this env stays exactly what the spec builds.
#
# STATUS 2026-10-20: CREATED on turing with MAMBA_SSL_VERIFY=true and mamba 2.1.1 (67 packages, the solve above;
# torch.backends.mkl.is_available() is True). NOT yet validated: CI's pip steps need pypi.org from this env's
# python3.14, which Little Snitch holds for an unanswered alert (plan §18.3 E-NET-3). Resume with
# util/ad-hoc/2026-10-19_turing_e2_validate_envs.py cascor --phase install. Export: reports/2026-10-20_turing-e2-envs/.
name: JuniperCascor1
