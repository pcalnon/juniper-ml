---
# turing conda env JuniperCanopy1: plan task E2 (decision D8), juniper-canopy's own env spec ported to osx-64.
#
# Source: pcalnon/juniper-canopy conf/conda_environment.yaml at main bd00115389a5415e30d396f69baca2f4ba36932b
# (blob e402df53), a `conda list --export` of 376 packages from a linux-64 host (conda 25.11.1). The owner's
# checkout (~/Development/python/Juniper/juniper-canopy) is 6 commits ahead of that main: one empty commit and
# five merges of origin/main, none changing a file, so its tracked files are identical to it.
#
# Derivation rules (2026-10-19):
#   - channels: conda-forge only. Every conda package keeps its Linux version; build strings are dropped.
#   - dropped as CUDA (87): cuda and the 46 other cuda-* packages, gds-tools, nsight-compute, libcublas[-dev],
#     libcufft[-dev], libcufile[-dev], libcurand[-dev], libcusolver[-dev], libcusparse[-dev], libnpp[-dev],
#     libnvfatbin[-dev], libnvjitlink[-dev], libnvjpeg[-dev], libnvptxcompiler-dev[_linux-64], the 15
#     nvidia-*-cu12 PyPI wheels and triton.
#   - dropped as Linux runtime or Linux toolchain (30): _libgcc_mutex, _openmp_mutex, alsa-lib, attr, keyutils,
#     libcap, libgcc, libgcc-ng, libgomp, libstdcxx, libstdcxx-ng, libuuid, ld_impl_linux-64, binutils,
#     binutils_impl_linux-64, binutils_linux-64, gcc, gcc_impl_linux-64, gcc_linux-64, gxx, gxx_impl_linux-64,
#     gxx_linux-64, conda-gcc-specs, libsanitizer, libgcc-devel_linux-64, libstdcxx-devel_linux-64,
#     sysroot_linux-64, kernel-headers_linux-64, and the c-compiler / cxx-compiler metapackages (on Linux they
#     are what installs that gcc set; on macOS they would install a clang toolchain instead).
#   - dropped, no osx-64 build at any version (16): libglvnd, libnl, libnuma, libopengl, libsystemd0, libudev1,
#     libxkbcommon, ocl-icd, rdma-core, wayland, xcb-util, xcb-util-cursor, xcb-util-image, xcb-util-keysyms,
#     xcb-util-renderutil, xcb-util-wm.
#   - everything else with an osx-64 build is kept at its Linux version, including the X11/xcb client libraries,
#     dbus, nss/nspr, xclip and opencl-headers.
#   - PyPI torch is replaced by conda-forge pytorch: PyPI has no x86_64 macOS torch wheel after 2.2.
#   - pip section: the 38 =pypi_0 lines that are neither CUDA nor torch, at their Linux versions.
#
# Relaxations. Each pin below has no osx-64 (or PyPI) build or cannot co-solve with one; nothing else is unpinned:
#   pytorch                torch 2.9.1 -> 2.10.0   conda-forge osx-64 has no py314 pytorch 2.9.x; 2.10.0 is the
#                                                  first. It is also the floor of juniper-canopy's [demo] extra.
#   xkeyboard-config       2.46 -> 2.47            osx-64 has 2.47 only.
#   xorg-libx11            1.8.12 -> 1.8.13        xkeyboard-config 2.47 requires xorg-libx11 >=1.8.13.
#   juniper-data (pip)     0.4.0 -> 0.4.2          0.4.0 was never published to PyPI (the Linux env had it from a
#                                                  local checkout); 0.4.2 is the oldest release there.
#
# BLAS, changed 2026-10-20 (plan §18.3 E-BLAS): libblas, libcblas and liblapack 3.11.0 -> 3.9.0 (the 20_osx64_mkl
# builds), libopenblas 0.3.30 dropped, mkl 2023.2.0 added (Intel's last macOS MKL). The solver then takes the cpu_mkl
# pytorch and adds tbb 2021.13.0. On Linux this env's torch is the PyPI wheel, which carries its own MKL, while numpy
# and scipy use the env's OpenBLAS. conda-forge's osx-64 pytorch links the env's libblas instead, so the first port
# ran torch on OpenBLAS (the cpu_generic build). That env hung juniper-canopy's unit lane at the same test in two
# runs, with three threads spinning in OpenBLAS's blas_memory_alloc. The MKL variant gives torch the BLAS it has on
# Linux, the stack JuniperCascor1 runs. numpy and scipy move to MKL with it, because libblas is one choice per env.
#
# Solve (mamba --dry-run against conda-forge osx-64 + noarch repodata of 2026-10-20), conda part: 224 packages;
# python 3.14.2, pytorch 2.10.0 cpu_mkl_py314_h7495620_103, mkl 2023.2.0, libblas 3.9.0 20_osx64_mkl, numpy 2.3.5,
# scipy 1.16.3. pip part: each pin has a pure or cp314 macosx x86_64 wheel on PyPI.
#
# Recreate:
#   MAMBA_SSL_VERIFY=true mamba env create --override-channels -c conda-forge -f conf/hosts/turing/conda-envs/JuniperCanopy1.yml
#   (mamba 2.x reads MAMBA_SSL_VERIFY; CONDA_SSL_VERIFY reaches only conda itself: plan §18.3 E-SSL.)
#
# Validate: juniper-canopy ci.yml's unit-tests and integration-tests lanes, run from a scratch copy of the repo
# through a `python -m venv --system-site-packages` overlay on this env, so CI's
# `pip install -e ".[test,juniper-cascor,observability]"` lands in the overlay and this env stays exactly what the
# spec builds. That install upgrades packaging, coverage and anyio past this spec's Linux versions: the [test]
# extra floors them at 26.3, 7.16.0 and 4.15.1.
#
# STATUS 2026-10-20: VALIDATED on turing, on the MKL variant above. Created with MAMBA_SSL_VERIFY=true and mamba
# 2.1.1 (224 conda packages, the solve above, plus the pip section; pip check is clean). juniper-canopy's CI lanes,
# run through util/ad-hoc/2026-10-19_turing_e2_validate_envs.py canopy: unit 7947 passed, 10 skipped and 2 failed
# of 7959 (coverage 96.68%, 558 s); integration 523 passed and 79 skipped of 602. Every skip is by design: these
# lanes run without juniper-data-client, and the Cassandra, Redis and JuniperData E2E tests are opt-in. The 2
# failures assume requests refuses a header value with a trailing LF, which it does from 2.33.1, while this spec
# keeps the Linux env's requests 2.32.5 (plan §18.3 E-REQ). Export, summary, the overlay's pip freeze and the
# OpenBLAS hang's evidence: reports/2026-10-20_turing-e2-envs/.
